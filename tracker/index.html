<title>NTPC Prep Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky signage-style header + scrolling tab bar, one content column (max 760px), route-line of 13 weekly stations on Today */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface2:#e9eef5; --ink:#101a2e; --muted:#566277; --line:#d5dce7;
  --accent:#0b3d91; --accent-ink:#ffffff; --signal:#e29a00; --ok:#1c8a4a; --bad:#c23a31;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131e; --surface:#16202f; --surface2:#1e2a3c; --ink:#e7ecf4; --muted:#94a1b6; --line:#2a3649;
  --accent:#6ea8ff; --accent-ink:#0d131e; --signal:#f2b52e; --ok:#4cc98a; --bad:#ff7b71; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131e; --surface:#16202f; --surface2:#1e2a3c; --ink:#e7ecf4; --muted:#94a1b6; --line:#2a3649;
  --accent:#6ea8ff; --accent-ink:#0d131e; --signal:#f2b52e; --ok:#4cc98a; --bad:#ff7b71; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--accent);z-index:30}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:var(--accent);color:var(--accent-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto}
.brand h1{font:700 24px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.brand span{font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:760px;margin:8px auto 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;color:inherit;opacity:.7;font:600 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;
  padding:10px 14px 9px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--signal)}
nav.tabs button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
main{padding-top:16px;display:grid;gap:16px}
h2{font:700 22px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
h3{font:600 17px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.num{font-variant-numeric:tabular-nums}
.board{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:14px;display:grid;gap:10px}
.board .big{font:700 52px/0.9 var(--f-display);letter-spacing:.02em}
.board .big small{font-size:22px;opacity:.75;font-weight:600}
.board .lab{font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font:700 26px/1 var(--f-display);margin-top:2px}
.stat .lab{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bar.accent i{background:var(--accent)}
.route{display:flex;align-items:center;margin:4px 0 0;overflow-x:auto;padding:6px 2px 2px}
.route .st{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--f-display);letter-spacing:.06em;color:var(--muted)}
.route .st i{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);background:var(--surface)}
.route .st.pass i{background:var(--ok);border-color:var(--ok)}
.route .st.now i{background:var(--signal);border-color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 30%,transparent)}
.route .st.now{color:var(--ink)}
.route .ln{flex:1 0 12px;height:3px;background:var(--line);margin-bottom:16px}
.route .ln.pass{background:var(--ok)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.task:first-of-type{border-top:0}
.task input{position:absolute;opacity:0;pointer-events:none}
.task .box{flex:0 0 24px;height:24px;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center;margin-top:1px}
.task input:checked + .box{background:var(--ok);border-color:var(--ok)}
.task input:checked + .box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.task .tx{flex:1 1 0;min-width:0}
.task .tm{font:600 12px var(--f-display);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;white-space:nowrap;margin-top:3px}
.task input:checked ~ .tx{color:var(--muted);text-decoration:line-through}
.chip{display:inline-block;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--surface2);color:var(--muted)}
.chip.now{background:var(--signal);color:#1a1200}
.chip.p1{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);flex:0 0 auto;margin-left:4px}
details[open]>summary::after{transform:rotate(-135deg)}
details>.in{padding:0 14px 12px}
details details{border:0;border-top:1px solid var(--line);border-radius:0;background:none}
details details>summary{padding:10px 0}
details details>.in{padding:0 0 8px}
summary:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:600 14px var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:5px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tp{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tp:first-of-type{border-top:0}
.tp .nm{font-weight:500}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cols button{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:8px 2px;cursor:pointer;min-width:0}
.cols button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
ul.l{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
svg text{font:600 11px var(--f-display);fill:var(--muted);letter-spacing:.04em}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.mock{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.mock:first-of-type{border-top:0}
.sc{font:700 28px/1 var(--f-display)}
.pill{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.cmon{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.cmon:first-of-type{border-top:0}
.sync{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>

<header class="top">
  <div class="brand"><h1>NTPC Prep Tracker</h1><span id="syncTag"></span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<div class="wrap"><main id="view"></main></div>

<script>
(function(){
"use strict";
/* ---------- plan data ---------- */
var M1=["Number System + divisibility","HCF & LCM","Simplification, BODMAS, surds","Fractions & Decimals","Percentage I","Percentage II + calculation tricks",
"Ratio & Proportion","Partnership + Ages","Average","Profit & Loss I","Profit & Loss II (discount, false weights)","*Mixed practice: Percentage, Ratio, Profit",
"Simple Interest","Compound Interest","Time & Work I","Time & Work II (pipes, wages)","Mixture & Alligation","*Mixed practice: Interest, Work, Mixture",
"Time, Speed & Distance I","Time, Speed & Distance II (trains, boats)","Algebra: identities","Algebra: equations","Mensuration 2D","Mensuration 3D",
"Geometry: lines, triangles","Geometry: circles, polygons","Trigonometry: ratios","Trigonometry: identities, heights & distances","Statistics + Data Interpretation","*Maths revision test (30 Q)"];
var R1=["Number series","Alphabet series","Analogy","Classification (odd one out)","Coding-Decoding I","Coding-Decoding II",
"Blood Relations","Direction & Distance","Ranking & Order","Mathematical Operations","Calendar & Clock","Alphabet/word arrangement, jumbling",
"Syllogism","Venn Diagrams","Statement-Conclusion","Statement-Course of Action","Data Sufficiency","*Mixed practice: verbal reasoning",
"Puzzle: linear arrangement","Seating: circular","Puzzle: floor/day based","Missing number, matrix","Maps & graph interpretation","*Mixed practice: puzzles",
"*Revision: series, coding, relations","*Revision: direction, ranking, ops","*Revision: syllogism, Venn, statements","*Revision: puzzles, seating","Decision making + Data analysis","*Reasoning revision test (30 Q)"];
var G1=["Ancient History","Medieval History","Modern History I (1757-1857)","Modern History II (1857-1947)","Art & Culture: dance, music, painting","Monuments, Literature, Books",
"Indian Geography I: physiography, rivers","Geography II: climate, soil, vegetation","Geography III: agriculture, minerals, industry","World Geography","Polity I: Preamble, Rights, DPSP","Polity II: Parliament, President, Judiciary",
"Polity III: amendments, bodies, Panchayati Raj","Economy I: basics, planning, NITI Aayog","Economy II: banking, RBI, budget, taxes","Economy III: schemes, PSUs, organisations","Physics I: motion, force, energy","Physics II: light, sound, electricity",
"Chemistry I: matter, atoms, acids","Chemistry II: metals, carbon, everyday chemistry","Biology I: human body","Biology II: diseases, nutrition, plants","Computers: basics, abbreviations","Environment & Ecology",
"Railways GK I: history, zones","Railways GK II: trains, projects, budget","Sports & Games","Awards, Books & Authors","Important days, Organisations (UN, IMF...)","Space, Nuclear, Defence"];
var M6=["Percentage + Profit & Loss + Ratio","SI, CI, Average, Mixture","Time & Work + Speed-Distance","Number System, HCF-LCM, Simplification","Algebra + Mensuration","Geometry + Trigonometry + Statistics"];
var R6=["Series + Coding-Decoding","Analogy, Odd-one-out, Math operations","Blood Relations, Direction, Ranking","Syllogism, Venn, Statements","Puzzles + Seating","Sectional test: Reasoning (30 Q, 30 min)"];
var G6=["History + Art & Culture","Geography + Environment","Polity + Economy","Physics + Chemistry + Biology","Computers, Awards, Sports, Days","Railways GK, PSUs, Transport, Flora & Fauna"];
var M7=["Arithmetic mixed set 1","Arithmetic mixed set 2 (harder)","Algebra + Geometry mixed set","Mensuration + Trigonometry + DI set","Speed round: 40 Q in 20 min","Sectional test: Maths (30 Q, 35 min)"];
var R7=["Mixed set 1","Mixed set 2: puzzles and arrangements","Mixed set 3: verbal reasoning","Mixed set 4: series, coding, maps","Weak-topic drills from error log","Sectional test: Reasoning (30 Q, 30 min)"];
var G7=["PYQ set: History + Culture","PYQ set: Geography + Environment","PYQ set: Polity + Economy","PYQ set: Science","PYQ set: Computers, Misc, Railways","Sectional test: GA (40 Q, 15 min)"];
var TOTAL=91;
var PHASES=[{n:1,name:"Foundation",from:1,to:35},{n:2,name:"Practice",from:36,to:63},{n:3,name:"Mocks",from:64,to:91}];
function phaseOf(n){return n<=35?PHASES[0]:n<=63?PHASES[1]:PHASES[2];}

function buildDays(){
  var days=[],mock=0,n,w,d,i,t;
  for(n=1;n<=TOTAL;n++){
    w=Math.floor((n-1)/7)+1; d=(n-1)%7+1; t=[]; var sum="";
    if(w<=5){
      if(d<=6){
        i=(w-1)*6+(d-1);
        t.push({l:"Maths: "+M1[i].replace("*",""),t:"2 h"});
        t.push({l:"Reasoning: "+R1[i].replace("*",""),t:"1.5 h"});
        t.push({l:"GA: "+G1[i].replace("*",""),t:"2 h"});
        sum=[M1[i],R1[i],G1[i]].map(function(x){return x.replace("*","")}).join(" · ");
      } else if(w===1){
        mock++; t.push({l:"Baseline mock #"+mock+" (full 90 min). Score does not matter, record it",t:"1.5 h"});
        t.push({l:"Analyse every wrong and skipped question; start the error log",t:"2 h"});
        t.push({l:"Revise the week: formulas + GA notes",t:"1 h"}); sum="Baseline mock + review";
      } else {
        t.push({l:"Weekly test: 100 mixed questions from weeks 1-"+w+" (timed)",t:"1.5 h"});
        t.push({l:"Analyse test, update error log",t:"1.5 h"});
        t.push({l:"Revise the week's formulas + GA notes",t:"1 h"}); sum="Weekly test + review";
      }
      if(n<=10) t.push({l:"Speed drill: tables to 30, squares to 30, cubes to 15",t:"20 min"});
      if(d<=6) t.push({l:"Recall yesterday's topics from memory, then check notes",t:"20 min"});
      t.push({l:"Current affairs: today's news, write 5 one-liners",t:"30 min"});
    } else if(w<=7){
      if(d<=6){
        var M=(w===6?M6:M7)[d-1],R=(w===6?R6:R7)[d-1],G=(w===6?G6:G7)[d-1];
        t.push({l:"Maths: "+(w===6?"timed sets (25 Q) + review: ":"")+M,t:"2 h"});
        t.push({l:"Reasoning: "+(w===6&&d<6?"timed sets (25 Q) + review: ":"")+R,t:"1.5 h"});
        t.push({l:"GA: "+(w===6?"revise + MCQ set: ":"")+G,t:"2 h"});
        t.push({l:"Current affairs: today's news + last week's notes",t:"30 min"}); sum=[M,R,G].join(" · ");
      } else { mock++; sum="Mock #"+mock;
        t.push({l:"Full mock #"+mock+" (90 min, timed sections)",t:"1.5 h"});
        t.push({l:"Analyse mock; log every error with cause",t:"2 h"});
        t.push({l:"Revise error log + weak topics",t:"1 h"});
        t.push({l:"Current affairs weekly recap",t:"30 min"}); }
    } else if(w<=9){
      var p=(w-8)*6+d;
      if(d<=6){
        t.push({l:"Previous-year paper #"+p+" (one full RRB NTPC shift, 90 min)",t:"1.5 h"});
        t.push({l:"Analyse paper; log errors",t:"1.5 h"});
        t.push({l:"Weak topics: Maths drill",t:"1 h"});
        t.push({l:"Weak topics: Reasoning drill",t:"45 min"});
        t.push({l:"GA: revise notes + current affairs",t:"1 h"}); sum="PYQ paper #"+p;
      } else { mock++; sum="Mock #"+mock;
        t.push({l:"Full mock #"+mock+" (90 min)",t:"1.5 h"});
        t.push({l:"Analyse mock; log every error with cause",t:"2 h"});
        t.push({l:"Revise error log + weak topics",t:"1 h"});
        t.push({l:"Current affairs weekly recap",t:"30 min"}); }
    } else if(n<=84){
      mock++; sum="Mock #"+mock;
      t.push({l:"Full mock #"+mock+" (90 min, exam timing)",t:"1.5 h"});
      t.push({l:"Analyse mock: every wrong, skipped and lucky-guess question",t:"2 h"});
      if(d<7){
        t.push({l:"Weak-area drill from error log",t:"1.5 h"});
        t.push({l:"GA recall: notes + current affairs",t:"1 h"});
        t.push({l:"Formulas + calculation speed",t:"20 min"});
      } else t.push({l:"Light revision only; rest in the evening",t:"1 h"});
    } else {
      if(d<=4){ mock++; sum="Mock #"+mock;
        t.push({l:"Full mock #"+mock+" (90 min)",t:"1.5 h"});
        t.push({l:"Analyse mock; fix only what you can fix quickly",t:"1.5 h"});
        t.push({l:"GA recall: notes + current affairs",t:"1 h"});
      } else if(d===5){ sum="Final revision";
        t.push({l:"Revise formula sheet + calculation tables",t:"1.5 h"});
        t.push({l:"Revise error log (all entries)",t:"1.5 h"});
        t.push({l:"Revise current affairs notes + GA one-liners",t:"1.5 h"});
      } else if(d===6){ sum="Light revision";
        t.push({l:"Skim GA tables (zones, schedules, vitamins, days)",t:"1 h"});
        t.push({l:"Light reasoning set to stay warm (20 Q)",t:"30 min"});
        t.push({l:"Check admit card, centre location, ID, travel plan",t:"30 min"});
      } else { sum="Rest day";
        t.push({l:"Rest. Sleep early; no new topics, no mock",t:"all day"});
        t.push({l:"Pack ID, admit card, pen if allowed; plan the route",t:"20 min"});
      }
    }
    days.push({n:n,w:w,d:d,ph:phaseOf(n),tasks:t,sum:sum});
  }
  return days;
}
var DAYS=buildDays();

function buildTopics(){
  var out=[];
  [["Maths",M1],["Reasoning",R1],["GA",G1]].forEach(function(s){
    s[1].forEach(function(name,i){
      if(name.charAt(0)==="*") return;
      out.push({k:s[0].charAt(0)+i,sub:s[0],name:name,day:Math.floor(i/6)*7+(i%6)+1});
    });
  });
  return out;
}
var TOPICS=buildTopics();
var SUBS=["Maths","Reasoning","GA"];
var COLS=["Learn","Practice","Rev 1","Rev 2","Rev 3"];
var CA_MONTHS=["Jul 2026","Aug 2026","Sep 2026","Oct 2026","Nov 2026","Dec 2026","Jan 2027"];
var CA_CATS=["National","International","Sports","Awards","Appointments","Schemes + Budget","Science, Space, Defence","Railways"];
var CAUSES=["Concept gap","Calculation slip","Silly mistake","Did not know","Ran out of time"];

/* ---------- state ---------- */
var LS="ntpc-tracker-v1", saveTimer=0, db=null, docRef=null, writing=false, dirty=false;
function blank(){return {t:0,start:"",done:{},topics:{},mocks:[],errors:[],ca:{}};}
var S=blank();
try{var raw=localStorage.getItem(LS); if(raw){var p=JSON.parse(raw); if(p&&typeof p==="object") S=Object.assign(blank(),p);}}catch(e){}
function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
var TODAY=iso(new Date());
if(!S.start) S.start=TODAY;
function fmt(d){return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}
function dateOf(n){return addDays(parse(S.start),n-1);}
function dayNum(){return Math.floor((parse(TODAY)-parse(S.start))/864e5)+1;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function setSync(txt){var e=document.getElementById("syncTag"); if(e) e.textContent=txt;}
function persist(){
  S.t=Date.now(); dirty=true;
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,900);
}
function flush(){
  if(!docRef||writing||!dirty) return;
  writing=true; dirty=false;
  docRef.set({json:JSON.stringify(S),t:S.t}).then(function(){setSync("Saved to your account");}).catch(function(){setSync("Saved on this device");}).then(function(){writing=false; if(dirty) flush();});
}
setSync("Saved on this device");
(async function(){
  try{
    if(!window.claude||!claude.use) return;
    var d=await claude.use("db"), u=await claude.use("user");
    if(!d||!u) return;
    var id=await u.id(); if(!id) return;
    db=d; docRef=db.doc("data/users/"+id+"/tracker");
    var snap=await docRef.get();
    if(snap.exists){
      var r=snap.data(), remote=JSON.parse(r.json);

/* ---------- stats ---------- */
function dayDone(n){var dd=DAYS[n-1],c=0;dd.tasks.forEach(function(_,i){if(S.done[n+"."+i])c++;});return c;}
function totals(){var a=0,b=0;DAYS.forEach(function(dd){a+=dd.tasks.length;b+=dayDone(dd.n);});return {all:a,done:b};}
function topicStats(){var tot=TOPICS.length,l=0,r3=0;TOPICS.forEach(function(t){var x=S.topics[t.k]||{};if(x[0])l++;if(x[4])r3++;});return {tot:tot,learned:l,rev3:r3};}
function streak(){
  var n=Math.min(dayNum(),TOTAL),c=0; if(n<1) return 0;
  if(dayDone(n)<DAYS[n-1].tasks.length) n--;
  for(;n>=1;n--){ if(dayDone(n)===DAYS[n-1].tasks.length) c++; else break; }
  return c;
}
function backlog(){var n=Math.min(dayNum()-1,TOTAL),c=0;for(var i=1;i<=n;i++){if(dayDone(i)<DAYS[i-1].tasks.length)c++;}return c;}
function pct(a,b){return b?Math.round(a*100/b):0;}

function chart(ms){

  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(90)+'" y2="'+y(90)+'" stroke="var(--signal)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(y(90)-4)+'" text-anchor="end" style="fill:var(--signal)">TARGET 90</text>';

  var pts=ms.map(function(m,i){return [L+(ms.length===1?pw/2:i*pw/(ms.length-1)),y(mockTotal(m)),mockTotal(m)];});
  s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+pts.map(function(p){return p[0]+","+p[1];}).join(" ")+'"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    if(i===pts.length-1||pts.length<=8) s+='<text x="'+p[0]+'" y="'+(p[1]-8)+'" text-anchor="middle" style="fill:var(--ink)">'+Math.round(p[2]*10)/10+'</text>';
  });
  s+='<text x="'+L+'" y="'+(H-5)+'">#1</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">#'+ms.length+'</text></svg>';
  return s;
}

function noteBlock(b){
  if(b[0]==="h") return '<h3 style="margin:14px 0 4px">'+esc(b[1])+'</h3>';
  if(b[0]==="ul") return '<ul class="l">'+b[1].map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
  var r=b[1];
  return '<div class="tbl" style="margin:8px 0"><table><tr>'+r[0].map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr>'+
    r.slice(1).map(function(row){return '<tr>'+row.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")+'</table></div>';
}
function vNotes(){
  var h='<h2>Notes and quick sheets</h2>';
  h+='<details data-k="n-ca"'+(openSet["n-ca"]?" open":"")+'><summary><h3>Current affairs tracker</h3></summary><div class="in"><p class="small muted" style="margin:0 0 6px">Cover the last six to seven months. Tick a box when you have made notes for that month and category. Use a monthly compilation PDF or a newspaper summary. This sheet does not hold the news itself, because it changes every month.</p>'+
    CA_MONTHS.map(function(m){
      return '<div class="cmon"><b>'+m+'</b><div class="seg">'+CA_CATS.map(function(c){var k=m+"|"+c;return '<button class="btn ghost sm" data-ca="'+esc(k)+'" aria-pressed="'+(!!S.ca[k])+'">'+esc(c)+'</button>';}).join("")+'</div></div>';}).join("")+'</div></details>';
  NOTES.forEach(function(n){
    h+='<details data-k="n-'+n.id+'"'+(openSet["n-"+n.id]?" open":"")+'><summary><h3>'+esc(n.title)+'</h3></summary><div class="in">'+n.b.map(noteBlock).join("")+'</div></details>';
  });
  return h;
}

/* ---------- render + events ---------- */
var view=document.getElementById("view"), tabsEl=document.getElementById("tabs");
function renderTabs(){
  tabsEl.innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>';}).join("");
}
function render(){
  var y=window.scrollY;
  renderTabs();
  var fn={today:vToday,days:vDays,topics:vTopics,mocks:vMocks,errors:vErrors,notes:vNotes}[tab]||vToday;
  view.innerHTML=fn();
  window.scrollTo(0,y);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
document.addEventListener("toggle",function(e){var d=e.target; if(d&&d.tagName==="DETAILS"&&d.dataset.k) openSet[d.dataset.k]=d.open;},true);
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-sub],[data-tp],[data-filter],[data-delmock],[data-ef],[data-errdone],[data-errpush],[data-delerr],[data-ca]");
  if(!t) return;
  var d=t.dataset;
  if(d.filter) dayFilter=d.filter;
  if(d.tab){tab=d.tab; try{history.replaceState(null,"","#"+tab);}catch(x){} window.scrollTo(0,0); var y0=0; renderTabs(); view.innerHTML=({today:vToday,days:vDays,topics:vTopics,mocks:vMocks,errors:vErrors,notes:vNotes}[tab]||vToday)(); return;}
  if(d.sub) topicSub=d.sub;
  if(d.tp){var p=d.tp.split(":"),o=S.topics[p[0]]||(S.topics[p[0]]={}); o[p[1]]=!o[p[1]]; persist();}
  if(d.delmock){S.mocks=S.mocks.filter(function(m){return m.id!==d.delmock;}); persist();}
  if(d.ef) errFilter=d.ef;
  if(d.errdone){S.errors.forEach(function(x){if(x.id===d.errdone)x.done=!x.done;}); persist();}
  if(d.errpush){S.errors.forEach(function(x){if(x.id===d.errpush)x.revisit=iso(addDays(parse(TODAY),7));}); persist();}
  if(d.delerr){S.errors=S.errors.filter(function(x){return x.id!==d.delerr;}); persist();}
  if(d.ca){S.ca[d.ca]=!S.ca[d.ca]; persist();}
  render();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.done){ if(t.checked) S.done[t.dataset.done]=1; else delete S.done[t.dataset.done]; persist(); render(); }
  else if(t.id==="startDate"&&t.value){S.start=t.value; persist(); render();}
});
document.addEventListener("submit",function(e){
  var f=e.target; e.preventDefault();
  var v=function(id){return document.getElementById(id).value;};
  if(f.id==="mockForm"){
    S.mocks.push({id:uid(),name:v("mName").trim(),date:v("mDate"),ga:+v("mGa"),maths:+v("mMa"),reas:+v("mRe"),at:v("mAt")===""?0:+v("mAt"),co:v("mCo")===""?0:+v("mCo"),tl:v("mTl"),note:v("mNo").trim()});
    persist(); render();
  } else if(f.id==="errForm"){
    S.errors.push({id:uid(),sub:v("eSub"),cause:v("eCause"),topic:v("eTopic").trim(),note:v("eNote").trim(),revisit:iso(addDays(parse(TODAY),7)),done:false});
    persist(); render();
  }
});
render();
})();
</script>
